<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Intro to Arrays</title>
  </head>
  <body>
    <h2>Arrays</h2>
    <p>Arrays are variables which can hold more than one value</p>
    <p>Type of Arrays are object</p>
    <!-- const fruits = ["Apple", "Peach","Pineapple"] -->
    <script>
        //  Accessing Values
        let arry1 = ["Ali","Ahmad"]
        console.log(arry1[1]);
        // Length
        console.log(arry1.length);

        // Changing the values
        let allNumbers = ["1","3", "5" ,"7" ,"10"]
        allNumbers[3] = 8
        console.log(allNumbers);
        console.log(typeof allNumbers);
        
        
        
        
</script>
  </body>
