<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Looping with Arrays</title>
</head>
<body>

    <script>

        let num = [3,54,1,4,2]
        for (let i = 0; i < num.length ; i++) {
            console.log(num);
            
        }
    </script>
</body>
</html>
