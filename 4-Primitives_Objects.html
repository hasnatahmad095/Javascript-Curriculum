<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Primitive & Data Types</title>
  </head>
  <body>
    <h2>Primitive Data Types & objects</h2>

    <ul>
      <li>Primitive data types are basic set of Data Types in Javascript.</li>
      <li>Objects are Non-Primitve Data Types in Javascript.</li>
      <li>There are 7 Primitive Data Types.</li>
      <li>NN BB SS U</li>
    </ul>

    <script>
      // ========================Primitive Data Types
      let a = null;
      let b = 34;
      let c = true;
      let d = BigInt("567");
      let e = "ali";
      let f = Symbol("I am a nice symbol");
      let g = undefined;
      console.log(a, b, c, d, e, f, g);
      console.log(typeof f);
      // ========================Objects
      const item = {
        harry: false,
        ali: true,
      };
      console.log(item, "item");
      console.log(typeof item);
    </script>
  </body>
</html>
