<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Document</title>
  </head>
  <body>
    <h2>Variable</h2>
    <p>A Variable is container that stores a value.</p>

    <h2>Rules for choosing Variables names:-</h2>
    <ul>
      <li>1-Letters, Digits, Underscores and $ sign allowed.</li>
      <li>2-Javascript reserved words cannot be used as variables.</li>
      <li>3-Ali and ali are different varibales (case senstive).</li>
    </ul>
    <script>
      // Javascript is Dynamic Type Language (We can change its type)
      var a = 67;
      console.log(a, "a");
      //    (a) is Identifier, (=) is Assignment operator (67) is Literal (Constant Value)
      a = "Ali";
      console.log(a, "a");
    </script>
  </body>
</html>
