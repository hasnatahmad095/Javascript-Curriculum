<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Intro to Strings</title>
</head>
<body>
    <h2>Strings</h2>
    <p>Strings are used to manipulate text</p>
    <!-- let x = "Ali" 
    let y = 'Ahmad'
    y.length (Calculate Length)     -->

    <h2>Template Literals</h2>
    <p>Template literals use backtics instead of quotes to define a string</p>

    <script>
        let x = "Ali"
        console.log(x,"x");
        console.log(x.length,"x");
        console.log(x[1],"x");

        // Template Literals
        let boy1 = "Numan"
        let boy2 = "Ahsan"
        let sentence = `${boy1} is a friend of ${boy2}`
        console.log(sentence);
        
        // Escape Sequence Characters
        // let fruit = 'Bana\'na'
        // console.log(fruit.length);

        // let fruit = 'Bana\nna'
        // console.log(fruit);

        // let fruit = 'Bana\tna'
        // console.log(fruit);


        let fruit = 'Bana\rna'
        console.log(fruit);
        
    </script>
</body>
</html>
